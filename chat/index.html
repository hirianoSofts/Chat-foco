<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título e descrição padrão que serão substituídos dinamicamente -->
    <title id="pageTitle">Assistente IA</title>
    <meta id="pageDescription" name="description" content="Assistente inteligente online.">
    
    <!-- Favicon dinâmico -->
    <link id="pageFavicon" rel="icon" type="image/x-icon" href="https://placehold.co/32x32/6366f1/ffffff?text=AI">

    <!-- Google Fonts: DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <!-- Flaticon UI Icons CDN -->
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    
    <style>
        :root {
            --font-main: 'DM Sans', sans-serif;
            --bg-app: #f8fafc;
            --bg-surface: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-main);
            background-color: var(--bg-app);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 680px;
            height: 100vh;
            background: var(--bg-surface);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        @media (min-width: 768px) {
            .chat-container {
                height: 85vh;
                border-radius: 16px;
                border: 1px solid var(--border-color);
            }
        }

        /* Chat Header */
        .chat-header {
            padding: 16px 20px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-app);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--primary);
            font-size: 18px;
            border: 1px solid var(--border-color);
        }

        .chat-info h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .chat-info p {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Messages Area */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #fafafa;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-top-left-radius: 4px;
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary);
            color: #ffffff;
            border-top-right-radius: 4px;
        }

        /* Input Area */
        .chat-input-area {
            padding: 16px 20px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-app);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .chat-input:focus {
            border-color: var(--primary);
            background: var(--bg-surface);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
            font-size: 16px;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .loading-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="chat-container" id="chatContainer">
        <div class="loading-state" id="loadingState">Carregando assistente inteligente...</div>
    </div>

    <!-- Script para carregar dados do Firebase e se comunicar com a Groq -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAwj0vcsUbdFDwFLt3xfOHCC--OhpF6nXs",
            authDomain: "focoplataforms.firebaseapp.com",
            databaseURL: "https://focoplataforms-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "focoplataforms",
            storageBucket: "focoplataforms.firebasestorage.app",
            messagingSenderId: "363051075501",
            appId: "1:363051075501:web:3ed9f67c5b46badce34324"
        };

        // Credenciais da Groq para teste direto no cliente
        const GROQ_API_KEY = "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";
        const DEFAULT_MODEL = "openai/gpt-oss-20b";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Tratamento e limpeza segura do parâmetro da URL (slug)
        const urlParams = new URLSearchParams(window.location.search);
        let aiSlug = urlParams.get('ai');

        if (aiSlug) {
            if (aiSlug.includes('?ai=')) {
                const parts = aiSlug.split('?ai=');
                aiSlug = parts[parts.length - 1];
            }
            aiSlug = aiSlug.replace(/[.#$[\]]/g, '').replace(/\/+$/, '').trim();
        }

        let assistantData = null;
        let messageHistory = [];

        async function initChat() {
            const container = document.getElementById('chatContainer');

            if (!aiSlug) {
                container.innerHTML = `<div class="loading-state">Nenhuma IA especificada na URL. Use o formato: ?ai=nome-da-ia</div>`;
                return;
            }

            try {
                // Busca os dados da IA no Firebase Realtime Database
                const aiRef = ref(db, 'assistants/' + aiSlug);
                const snapshot = await get(aiRef);

                if (!snapshot.exists()) {
                    container.innerHTML = `<div class="loading-state">Assistente "${aiSlug}" não encontrado no banco de dados.</div>`;
                    return;
                }

                assistantData = snapshot.val();

                // 1. Define o Título da Página com o Nome da IA
                if (assistantData.name) {
                    document.getElementById('pageTitle').textContent = assistantData.name;
                }

                // 2. Define a Descrição da Página (Meta Description)
                if (assistantData.description) {
                    document.getElementById('pageDescription').setAttribute('content', assistantData.description);
                }

                // 3. Define o Logótipo como Favicon da Aba
                if (assistantData.logoUrl) {
                    document.getElementById('pageFavicon').setAttribute('href', assistantData.logoUrl);
                }

                // Aplica cor de tema personalizada se existir
                if (assistantData.themeColor) {
                    document.documentElement.style.setProperty('--primary', assistantData.themeColor);
                }

                // Renderiza o layout do Chat
                container.innerHTML = `
                    <div class="chat-header">
                        <img src="${assistantData.logoUrl || ''}" alt="Logo" class="chat-avatar" onerror="this.outerHTML='<div class=\'chat-avatar\'>${(assistantData.name || 'A').charAt(0)}</div>'">
                        <div class="chat-info">
                            <h2>${assistantData.name || 'Assistente Virtual'}</h2>
                            <p>${assistantData.description || 'Assistente Inteligente Online'}</p>
                        </div>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <div class="message ai">${assistantData.welcomeMessage || 'Olá! Como posso ajudar você hoje?'}</div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="userInput" class="chat-input" placeholder="Digite sua mensagem..." autocomplete="off">
                        <button type="button" id="sendBtn" class="send-btn">
                            <i class="fi fi-rr-paper-plane"></i>
                        </button>
                    </div>
                `;

                // Configura o prompt inicial do sistema
                if (assistantData.systemPrompt) {
                    messageHistory.push({
                        role: "system",
                        content: assistantData.systemPrompt
                    });
                }
                if (assistantData.welcomeMessage) {
                    messageHistory.push({
                        role: "assistant",
                        content: assistantData.welcomeMessage
                    });
                }

                const input = document.getElementById('userInput');
                const sendBtn = document.getElementById('sendBtn');

                sendBtn.addEventListener('click', sendMessage);
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') sendMessage();
                });

            } catch (error) {
                console.error("Erro no Firebase:", error);
                container.innerHTML = `<div class="loading-state" style="color: #ef4444;">Erro ao carregar do Firebase: ${error.message}</div>`;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const messagesContainer = document.getElementById('chatMessages');

            // Adiciona a mensagem do usuário na tela
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.textContent = text;
            messagesContainer.appendChild(userMsgDiv);

            input.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            messageHistory.push({ role: "user", content: text });

            // Indicador de digitação
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typingIndicator';
            typingDiv.textContent = 'Digitando...';
            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                // Chamada direta à API da Groq no cliente
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GROQ_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: DEFAULT_MODEL,
                        messages: messageHistory,
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                const data = await response.json();
                
                const typingElem = document.getElementById('typingIndicator');
                if (typingElem) typingElem.remove();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'Erro na resposta da Groq');
                }

                const aiReply = data.choices[0].message.content;
                messageHistory.push({ role: "assistant", content: aiReply });

                // Exibe a resposta da IA na tela
                const aiMsgDiv = document.createElement('div');
                aiMsgDiv.className = 'message ai';
                aiMsgDiv.textContent = aiReply;
                messagesContainer.appendChild(aiMsgDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

            } catch (error) {
                console.error("Erro no envio:", error);
                const typingElem = document.getElementById('typingIndicator');
                if (typingElem) typingElem.remove();

                const errorDiv = document.createElement('div');
                errorDiv.className = 'message ai';
                errorDiv.style.color = '#ef4444';
                errorDiv.textContent = 'Erro ao obter resposta da Groq: ' + error.message;
                messagesContainer.appendChild(errorDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        initChat();
    </script>
</body>
</html>
